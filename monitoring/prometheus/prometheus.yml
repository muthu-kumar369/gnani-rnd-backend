global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alert rules
rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'gnani-backend'
    static_configs:
      - targets: ['host.docker.internal:9464']
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
