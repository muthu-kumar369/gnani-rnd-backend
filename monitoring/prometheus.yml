global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gnani-monitor'

scrape_configs:
  # Gnani Backend Metrics
  - job_name: 'gnani-backend'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    
  # Node.js Process Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  # Frontend Metrics (if exposed)
  - job_name: 'gnani-frontend'
    static_configs:
      - targets: ['localhost:5173']
    metrics_path: '/metrics'

# Alerting rules
rule_files:
  - 'alerts.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
