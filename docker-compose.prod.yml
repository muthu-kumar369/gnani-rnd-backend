version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gnani-backend:prod
    container_name: gnani-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/gnani
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_DB_URL=http://chromadb:8000
      - USE_WHISPER_CPP=true
      - ENABLE_LLM_CACHE=true
      - ENABLE_TOOL_CACHE=true
      - LLM_MODEL=gemma:2b
    depends_on:
      - mongodb
      - redis
      - chromadb
    networks:
      - gnani-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:6.0
    container_name: gnani-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - gnani-network

  redis:
    image: redis:7-alpine
    container_name: gnani-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gnani-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    container_name: gnani-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - gnani-network

  prometheus:
    image: prom/prometheus:latest
    container_name: gnani-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - gnani-network

  grafana:
    image: grafana/grafana:latest
    container_name: gnani-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - gnani-network
    depends_on:
      - prometheus

networks:
  gnani-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  chromadb_data:
  prometheus_data:
  grafana_data:
