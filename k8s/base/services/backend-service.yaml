apiVersion: v1
kind: Service
metadata:
  name: gnani-backend
  labels:
    app: gnani-backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  selector:
    app: gnani-backend
---
apiVersion: v1
kind: Service
metadata:
  name: gnani-backend-headless
  labels:
    app: gnani-backend
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 3001
    targetPort: 3001
  - name: grpc
    port: 50051
    targetPort: 50051
  selector:
    app: gnani-backend
