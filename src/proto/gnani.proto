// backend/src/proto/gnani.proto
syntax = "proto3";

package gnani;

service GnaniService {
  rpc StartSession (StartSessionRequest) returns (StartSessionResponse);
  rpc SendAudioStream (stream SendAudioStreamRequest) returns (stream SendAudioStreamResponse);
  rpc EndSession (EndSessionRequest) returns (EndSessionResponse);
}

message StartSessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message StartSessionResponse {
  bool success = 1;
  string message = 2;
  string session_id = 3;
}

message SendAudioStreamRequest {
  string session_id = 1;
  bytes audio_chunk = 2;
  bool end_of_stream = 3;
  string text_input = 4;
}

message SendAudioStreamResponse {
  oneof event {
    string partial_text = 1;
    string llm_chunk = 2;
    string final_text = 3;
    string error_message = 4;
    ToolStatus tool_status = 5;
    TitleUpdate title_update = 6;
    TypingStatus typing_status = 7;
  }
  string segment_id = 8;
}

message ToolStatus {
  string tool_name = 1;
  string status = 2; // 'starting', 'running', 'completed', 'failed'
  int32 progress = 3; // 0-100
  string message = 4; // Human-readable status
  int64 elapsed_ms = 5; // Time elapsed
}

message TitleUpdate {
  string session_id = 1;
  string title = 2;
}

message TypingStatus {
  string status = 1; // 'thinking', 'generating', 'idle'
  string message = 2; // Optional custom message
}

message EndSessionRequest {
  string session_id = 1;
}

message EndSessionResponse {
  bool success = 1;
  string message = 2;
  string session_summary = 3;
}
